name: nerdpool

# Beta-Server: Bitcoin Core (pruned), Doichain Core, Pool, Caddy mit dem NerdPool-Dashboard.
# Konfiguration in .env (Vorlage .env.example), Pool-Einstellungen in pool.env.

x-rpc-allow: &rpc-allow
  # Docker-Netze; die RPC-Ports werden nicht nach außen veröffentlicht
  - -rpcbind=0.0.0.0
  - -rpcallowip=172.16.0.0/12
  - -rpcallowip=10.0.0.0/8
  - -rpcallowip=192.168.0.0/16

services:
  bitcoind:
    image: bitcoin/bitcoin:${BITCOIN_IMAGE_TAG:-29.5}
    container_name: nerdpool-bitcoind
    restart: unless-stopped
    stop_grace_period: 10m
    command:
      - -server=1
      - -printtoconsole
      - -prune=${BITCOIN_PRUNE_MB:-20000}
      - -dbcache=${BITCOIN_DBCACHE_MB:-1500}
      - -maxmempool=300
      - -maxconnections=40
      - -listen=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=172.16.0.0/12
      - -rpcallowip=10.0.0.0/8
      - -rpcallowip=192.168.0.0/16
      - -rpcuser=${BITCOIN_RPC_USER:-pool}
      - -rpcpassword=${BITCOIN_RPC_PASSWORD:?BITCOIN_RPC_PASSWORD in .env setzen}
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubhashblock=tcp://0.0.0.0:28333
    ports:
      - "8333:8333"
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-rpcuser=${BITCOIN_RPC_USER:-pool}", "-rpcpassword=${BITCOIN_RPC_PASSWORD}", "getblockchaininfo"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 5m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  doichaind:
    build: ./doichain
    image: nerdpool/doichain-core:v31.1.6
    container_name: nerdpool-doichaind
    restart: unless-stopped
    stop_grace_period: 5m
    command:
      - -server=1
      - -printtoconsole
      - -datadir=/data
      - -listen=1
      # Doichain Core 31.1.6 versucht ohne explizites -bind 127.0.0.1:8339 zu binden und kollidiert mit dem
      # RPC-Port 8339 ("Failed to listen on any port"); mit explizitem Bind auf den P2P-Port 8338 startet es.
      - -bind=0.0.0.0:8338
      - -listenonion=0
      # Transaktionsindex für den Explorer (getrawtransaction beliebiger Transaktionen), wird im Hintergrund aufgebaut
      - -txindex=1
      - -maxconnections=40
      - -rpcbind=0.0.0.0
      - -rpcallowip=172.16.0.0/12
      - -rpcallowip=10.0.0.0/8
      - -rpcallowip=192.168.0.0/16
      - -rpcuser=${DOICHAIN_RPC_USER:-pool}
      - -rpcpassword=${DOICHAIN_RPC_PASSWORD:?DOICHAIN_RPC_PASSWORD in .env setzen}
    ports:
      - "8338:8338"
    volumes:
      - doichain-data:/data
    healthcheck:
      test: ["CMD", "doichain-cli", "-datadir=/data", "-rpcuser=${DOICHAIN_RPC_USER:-pool}", "-rpcpassword=${DOICHAIN_RPC_PASSWORD}", "getblockchaininfo"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 5m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  pool:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nerdpool/pool:latest
    container_name: nerdpool-pool
    restart: unless-stopped
    depends_on:
      - bitcoind
      - doichaind
    env_file:
      - ./pool.env
    environment:
      - NODE_ENV=production
      - BITCOIN_RPC_USER=${BITCOIN_RPC_USER:-pool}
      - BITCOIN_RPC_PASSWORD=${BITCOIN_RPC_PASSWORD}
      - DOICHAIN_RPC_USER=${DOICHAIN_RPC_USER:-pool}
      - DOICHAIN_RPC_PASSWORD=${DOICHAIN_RPC_PASSWORD}
      - DOICHAIN_DEFAULT_ADDRESS=${DOICHAIN_DEFAULT_ADDRESS:?DOICHAIN_DEFAULT_ADDRESS in .env setzen}
      - POOL_IDENTIFIER=${POOL_IDENTIFIER:-NerdPool}
      - DEV_FEE_ADDRESS=${DEV_FEE_ADDRESS:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_ANNOUNCE_CHAT_ID=${TELEGRAM_ANNOUNCE_CHAT_ID:-}
      # öffentliche Adresse für Links in Nachrichten und Teilen-Seiten, Client-IPs aus X-Forwarded-For von Caddy
      - POOL_PUBLIC_URL=https://${POOL_DOMAIN:?POOL_DOMAIN in .env setzen}
      - TRUST_PROXY=true
    ports:
      # Stratum nach außen, die API (3334) bleibt im Docker-Netz und wird von Caddy unter /api ausgeliefert
      - "${STRATUM_PORT:-3333}:3333"
      # stratum+ssl mit dem Let's-Encrypt-Zertifikat von Caddy (Port 3443 im Container, STRATUM_TLS_PORT in pool.env)
      - "${STRATUM_TLS_PORT:-3443}:3443"
    volumes:
      - pool-db:/public-pool/DB
      # Caddys Zertifikatsspeicher, nur lesend: der Pool nimmt daraus das Zertifikat für stratum+ssl
      - caddy-data:/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build:
      # Dashboard aus web/ (Vite + Svelte), Rechtstexte und Caddy-Vorlage aus deploy/web
      context: ..
      dockerfile: deploy/web/Dockerfile
    image: nerdpool/web:latest
    container_name: nerdpool-web
    restart: unless-stopped
    depends_on:
      - pool
    environment:
      - POOL_DOMAIN=${POOL_DOMAIN:?POOL_DOMAIN in .env setzen}
      - STRATUM_PORT=${STRATUM_PORT:-3333}
      - STRATUM_TLS_PORT=${STRATUM_TLS_PORT:-3443}
      - POOL_BETA=${POOL_BETA:-true}
      - ACME_EMAIL=${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Rechtstexte: Änderungen hier brauchen nur "docker compose restart web", keinen Neubau
      - ./web/legal:/srv/legal-src:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  bitcoin-data:
  doichain-data:
  pool-db:
  caddy-data:
  caddy-config:
